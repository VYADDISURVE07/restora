name: Self-tests

on:
  push:
  pull_request:

concurrency:                           # a new push replaces a run that is still in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        include:                       # the oldest supported Python (newer Ubuntu images no longer ship 3.9)
          - os: ubuntu-22.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r requirements.txt pytest-github-actions-annotate-failures pytest-timeout
      - name: Restora's own tests
        shell: bash
        run: |
          set +e
          python -m pytest selftest -q -p no:cacheprovider -c pytest.ini -rf --timeout=120 > selftest.log 2>&1
          code=$?
          cat selftest.log
          if [ "$code" -ne 0 ]; then
            { echo "### Self-tests failed (${{ matrix.os }}, Python ${{ matrix.python }})"; echo '```'; tail -80 selftest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Demo Bank (expects exactly the one deliberate server error)
        shell: bash
        run: |
          set +e
          python run.py --demo --brain rules --junit demo-junit.xml > demo.log 2>&1
          code=$?
          cat demo.log
          if [ "$code" -ne 1 ]; then
            { echo "### Demo Bank: exit code $code, expected 1"; echo '```'; tail -60 demo.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Corrected sheet passes with the brain off
        shell: bash
        run: |
          set +e
          sheet=$(ls -t reports/demo_bank_messy_*/demo_bank_messy_corrected.csv | head -1)
          python run.py "$sheet" --demo --brain off > corrected.log 2>&1
          code=$?
          cat corrected.log
          if [ "$code" -ne 1 ]; then
            { echo "### Corrected sheet: exit code $code, expected 1"; echo '```'; tail -60 corrected.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
